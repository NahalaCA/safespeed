<!DOCTYPE html>
<html>
<head>
	<title>emg change password</title>
</head>
<body>
	<center><h1>Emergency Change Password</h1>
		<form method="post">
			<table>
				<tr>
					<th>User Name</th>
					<td><input type="text" name="uname" class="form-control" required=""></td>
				</tr>
				<tr>
					<th>Old Password</th>
					<td><input type="password" name="password" class="form-control" required="" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"></td>
				</tr>
				<tr>
					<th>New Password</th>
					<td><input type="password" name="newpass"  class="form-control" required="" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"></td>
				</tr>
				<tr>
					<td align="center" colspan="2"><input type="submit" name="submit"></td>
				</tr>
			</table>
			
		</form>

	</center>


</body>
</html>
